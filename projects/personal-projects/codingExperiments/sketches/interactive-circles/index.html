<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Interactive Circles</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #141414;
      }

      #sketch-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      #sketch-container canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
    </style>

    <!-- Load the p5.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/p5.min.js"></script>

    <!-- Load our sketch -->
    <script src="sketch.js" defer></script>
  </head>

  <body>
    <div id="sketch-container"></div>
  </body>
</html>
